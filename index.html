<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Analytics Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-slate-800 tracking-tight">Analytics Explorer</h1>
        <div id="status" class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full border border-green-100 uppercase">Ready</div>
    </header>

    <main class="max-w-7xl mx-auto px-6 mt-8">
        <div id="country-selector" class="flex gap-2 overflow-x-auto pb-6"></div>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>

        <div id="loader" class="hidden py-10 text-center text-indigo-600 font-bold animate-pulse text-[10px] uppercase tracking-widest">
            Loading from Gemini AI...
        </div>
    </main>

    <script>
        const API_KEY = "AIzaSyBBPk6E2848nn6Srr_sNdXZaZnecLBNci8";
        const countries = [
            { name: 'United States', flag: '🇺🇸' },
            { name: 'España', flag: '🇪🇸' },
            { name: 'México', flag: '🇲🇽' },
            { name: 'United Kingdom', flag: '🇬🇧' }
        ];

        let currentCountry = countries[0].name;
        let websites = [];
        let page = 0;
        let loading = false;

        // --- RENDERIZADO ---
        function renderCountries() {
            const container = document.getElementById('country-selector');
            container.innerHTML = countries.map(c => `
                <button onclick="changeCountry('${c.name}')" class="px-4 py-2 rounded-full text-xs font-bold transition-all flex-shrink-0 ${currentCountry === c.name ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-100'}">
                    ${c.flag} ${c.name}
                </button>
            `).join('');
        }

        function renderWebsites(append = false) {
            const container = document.getElementById('grid');
            const html = websites.map((site, i) => `
                <div class="card bg-white rounded-xl shadow-sm p-4 border border-slate-100 flex flex-col h-full shadow-sm hover:shadow-md transition-shadow">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">#${i + 1}</span>
                        <h3 class="font-bold text-slate-800 text-sm truncate">${site.websiteUrl}</h3>
                    </div>
                    <div class="mb-4 flex-grow">
                        <div class="flex items-end gap-1 mb-1">
                            <span class="text-xl font-black text-indigo-600 leading-none">${site.monthlyViews || 'N/A'}</span>
                            <span class="text-[9px] text-slate-400 font-bold uppercase">Views</span>
                        </div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">${site.category}</p>
                        <p class="text-xs text-slate-600 line-clamp-2">${site.companyName}</p>
                    </div>
                    <div class="flex gap-2 mt-auto">
                        <a href="https://${site.websiteUrl}" target="_blank" class="flex-1 text-center py-2 rounded-lg bg-slate-100 text-slate-700 text-[10px] font-bold">Site</a>
                        <a href="https://www.linkedin.com/search/results/all/?keywords=${site.companyName}" target="_blank" class="flex-1 text-center py-2 rounded-lg bg-[#0077b5] text-white text-[10px] font-bold">LinkedIn</a>
                    </div>
                </div>
            `).join('');
            container.innerHTML = html;
        }

        // --- LÓGICA ---
        async function fetchBatch() {
            if (loading || page >= 5) return;
            loading = true;
            document.getElementById('loader').classList.remove('hidden');
            
            const start = page * 20 + 1;
            const end = (page + 1) * 20;

            try {
                const prompt = `Provide a JSON list of top websites #${start} to #${end} in ${currentCountry}. Format: [{"websiteUrl": "domain.com", "companyName": "Name", "category": "Category", "monthlyViews": "450M"}]. JSON ONLY.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const result = await response.json();
                const text = result.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                const newData = JSON.parse(text);
                
                websites = [...websites, ...newData];
                renderWebsites();
            } catch (e) {
                console.error(e);
            } finally {
                loading = false;
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function changeCountry(name) {
            currentCountry = name;
            websites = [];
            page = 0;
            renderCountries();
            fetchBatch();
        }

        // Scroll Infinito
        window.onscroll = function() {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (!loading) {
                    page++;
                    fetchBatch();
                }
            }
        };

        // Inicio
        renderCountries();
        fetchBatch();
    </script>
</body>
</html>
