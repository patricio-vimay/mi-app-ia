<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Analytics Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const COUNTRIES = [
            { id: 'us', name: 'United States', flag: '🇺🇸' },
            { id: 'gb', name: 'United Kingdom', flag: '🇬🇧' },
            { id: 'ca', name: 'Canada', flag: '🇨🇦' },
            { id: 'au', name: 'Australia', flag: '🇦🇺' },
            { id: 'es', name: 'España', flag: '🇪🇸' }
        ];

        const WebsiteCard = ({ site, index }) => (
            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all">
                <div className="flex justify-between items-start mb-4">
                    <span className="flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 font-bold text-sm">
                        {index + 1}
                    </span>
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider bg-slate-50 px-2 py-1 rounded">
                        {site.category}
                    </span>
                </div>
                <h4 className="font-bold text-slate-800 text-lg mb-1 truncate">{site.companyName}</h4>
                <p className="text-xs text-slate-400 mb-4 font-mono">{site.websiteUrl}</p>
                <div className="space-y-1">
                    <div className="flex justify-between text-[10px] font-bold text-slate-500 uppercase">
                        <span>Traffic Share</span>
                        <span>{site.trafficShare}%</span>
                    </div>
                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div 
                            className="bg-indigo-500 h-full rounded-full transition-all duration-1000" 
                            style={{ width: `${site.trafficShare}%` }}
                        ></div>
                    </div>
                </div>
            </div>
        );

        function App() {
            const [selectedCountry, setSelectedCountry] = useState(COUNTRIES[0]);
            const [loading, setLoading] = useState(false);
            const [search, setSearch] = useState('');
            const [data, setData] = useState([]);

            // La clave que proporcionaste
            const API_KEY = "AIzaSyBBPk6E2848nn6Srr_sNdXZaZnecLBNci8"; 

            const fetchGeminiData = useCallback(async (countryName) => {
                setLoading(true);
                try {
                    const prompt = `Actúa como un experto en analítica web. Proporciona un JSON estrictamente con los 10 sitios web más visitados en ${countryName} actualmente. El formato debe ser una lista de objetos: [{"websiteUrl": "ejemplo.com", "companyName": "Nombre", "category": "Categoría", "trafficShare": número_del_1_al_100}]. No incluyas texto extra ni bloques de código, solo el JSON puro.`;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const result = await response.json();
                    const textResponse = result.candidates[0].content.parts[0].text;
                    const cleanJson = textResponse.replace(/```json|```/g, "").trim();
                    setData(JSON.parse(cleanJson));
                } catch (err) {
                    console.error("Error:", err);
                    setData([{ websiteUrl: "error.com", companyName: "Límite de API alcanzado", category: "Error", trafficShare: 0 }]);
                } finally {
                    setLoading(false);
                }
            }, [API_KEY]);

            useEffect(() => {
                fetchGeminiData(selectedCountry.name);
            }, [selectedCountry, fetchGeminiData]);

            const filteredData = useMemo(() => {
                return data.filter(s => s.companyName.toLowerCase().includes(search.toLowerCase()));
            }, [data, search]);
