<!DOCTYPE html>
<html>
<head>
    <title>Analytics Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white p-10">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-5">Market Intelligence Pro</h1>
        <p class="mb-10 text-gray-400">Haz clic en un país para cargar los datos desde Gemini AI.</p>
        
        <div class="flex gap-4 mb-10">
            <button onclick="askGemini('USA')" class="bg-blue-600 px-6 py-2 rounded-lg font-bold">USA</button>
            <button onclick="askGemini('España')" class="bg-red-600 px-6 py-2 rounded-lg font-bold">España</button>
        </div>

        <div id="loading" class="hidden text-yellow-400 animate-pulse">Consultando a la IA...</div>
        <pre id="output" class="bg-gray-800 p-5 rounded-xl overflow-auto whitespace-pre-wrap text-sm text-green-400 border border-gray-700"></pre>
    </div>

    <script>
        async function askGemini(pais) {
            const out = document.getElementById('output');
            const loader = document.getElementById('loading');
            const key = "AIzaSyBBPk6E2848nn6Srr_sNdXZaZnecLBNci8";
            
            loader.classList.remove('hidden');
            out.innerText = "";

            try {
                const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    body: JSON.stringify({contents: [{parts: [{text: `Dame el top 20 sitios web de ${pais} con su categoría y visitas.`}]}]})
                });
                const data = await resp.json();
                out.innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                out.innerText = "Error: " + e.message;
            } finally {
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
