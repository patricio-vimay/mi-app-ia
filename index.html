<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Analytics Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DATOS DE LOS PAÍSES ---
        const COUNTRIES = [
            { id: 'us', name: 'United States', flag: '🇺🇸' },
            { id: 'gb', name: 'United Kingdom', flag: '🇬🇧' },
            { id: 'ca', name: 'Canada', flag: '🇨🇦' },
            { id: 'au', name: 'Australia', flag: '🇦🇺' },
            { id: 'es', name: 'España', flag: 'es' }
        ];

        // --- COMPONENTE DE CARTA DE SITIO WEB ---
        const WebsiteCard = ({ site, index }) => (
            <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition-all">
                <div className="flex justify-between items-start mb-4">
                    <span className="flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 font-bold text-sm">
                        {index + 1}
                    </span>
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-wider bg-slate-50 px-2 py-1 rounded">
                        {site.category}
                    </span>
                </div>
                <h4 className="font-bold text-slate-800 text-lg mb-1 truncate">{site.companyName}</h4>
                <p className="text-xs text-slate-400 mb-4 font-mono">{site.websiteUrl}</p>
                <div className="space-y-1">
                    <div className="flex justify-between text-[10px] font-bold text-slate-500 uppercase">
                        <span>Traffic Share</span>
                        <span>{site.trafficShare}%</span>
                    </div>
                    <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                        <div 
                            className="bg-indigo-500 h-full rounded-full transition-all duration-1000" 
                            style={{ width: `${site.trafficShare}%` }}
                        ></div>
                    </div>
                </div>
            </div>
        );

        // --- APP PRINCIPAL ---
        function App() {
            const [selectedCountry, setSelectedCountry] = useState(COUNTRIES[0]);
            const [loading, setLoading] = useState(false);
            const [search, setSearch] = useState('');
            const [data, setData] = useState([]);

            // Simulador de carga de datos (Sustituye a Gemini por ahora para evitar errores)
            useEffect(() => {
                setLoading(true);
                setTimeout(() => {
                    const mockData = [
                        { websiteUrl: "google.com", companyName: "Google", category: "Search", trafficShare: 92 },
                        { websiteUrl: "youtube.com", companyName: "YouTube", category: "Video", trafficShare: 78 },
                        { websiteUrl: "amazon.com", companyName: "Amazon", category: "Shopping", trafficShare: 65 },
                        { websiteUrl: "facebook.com", companyName: "Facebook", category: "Social", trafficShare: 45 },
                        { websiteUrl: "wikipedia.org", companyName: "Wikipedia", category: "Education", trafficShare: 38 },
                        { websiteUrl: "reddit.com", companyName: "Reddit", category: "Community", trafficShare: 30 },
                    ];
                    setData(mockData);
                    setLoading(false);
                }, 800);
            }, [selectedCountry]);

            const filteredData = data.filter(s => 
                s.companyName.toLowerCase().includes(search.toLowerCase())
            );

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-200">
                                    <i className="fa-solid fa-chart-pie text-white"></i>
                                </div>
                                <h1 className="text-xl font-black text-slate-800 tracking-tight">GLOBAL ANALYTICS</h1>
                            </div>
                            <div className="hidden md:block text-xs font-bold text-green-500 bg-green-50 px-3 py-1 rounded-full border border-green-100">
                                <i className="fa-solid fa-bolt mr-1"></i> LIVE DATA 2026
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 mt-10">
                        {/* Selector de Países */}
                        <div className="flex gap-3 overflow-x-auto pb-6 scrollbar-hide">
                            {COUNTRIES.map(c => (
                                <button 
                                    key={c.id}
                                    onClick={() => setSelectedCountry(c)}
                                    className={`flex-shrink-0 px-6 py-3 rounded-2xl font-bold transition-all ${
                                        selectedCountry.id === c.id 
                                        ? 'bg-indigo-600 text-white shadow-xl shadow-indigo-100 scale-105' 
                                        : 'bg-white text-slate-500 border border-slate-100 hover:bg-slate-50'
                                    }`}
                                >
                                    <span className="mr-2 text-lg">{c.flag}</span> {c.name}
                                </button>
                            ))}
                        </div>

                        {/* Buscador */}
                        <div className="relative my-8">
                            <i className="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input 
                                type="text"
                                placeholder={`Search digital leaders in ${selectedCountry.name}...`}
                                className="w-full pl-14 pr-6 py-5 bg-white rounded-2xl border border-slate-100 shadow-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 transition-all outline-none text-slate-600 font-medium"
                                onChange={(e) => setSearch(e.target.value)}
                            />
                        </div>

                        {/* Grid de Resultados */}
                        {loading ? (
                            <div className="text-center py-20">
                                <div className="inline-block w-12 h-12 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin"></div>
                                <p className="mt-4 text-slate-400 font-bold animate-pulse">Analyzing Market Share...</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredData.map((site, i) => (
                                    <WebsiteCard key={i} site={site} index={i} />
                                ))}
                            </div>
                        )}
                    </main>

                    <footer className="text-center mt-20 text-slate-400 text-sm font-medium">
                        © 2026 Global Analytics Explorer • Powered by React & Tailwind
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
