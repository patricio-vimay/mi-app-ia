<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Web Analytics Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const API_KEY = "AIzaSyBBPk6E2848nn6Srr_sNdXZaZnecLBNci8";
        const COUNTRIES = [
            { id: 'us', name: 'United States', flag: '🇺🇸' },
            { id: 'es', name: 'España', flag: '🇪🇸' },
            { id: 'mx', name: 'México', flag: '🇲🇽' },
            { id: 'gb', name: 'United Kingdom', flag: '🇬🇧' }
        ];

        const WebsiteCard = ({ site, index }) => (
            <div className="bg-white rounded-xl shadow-sm p-4 border border-slate-100 flex flex-col h-full hover:shadow-md transition-shadow">
                <div className="flex items-center gap-2 mb-3">
                    <span className="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded">#{index + 1}</span>
                    <h3 className="font-bold text-slate-800 text-sm truncate">{site.websiteUrl}</h3>
                </div>
                <div className="mb-4 flex-grow">
                    <div className="flex items-end gap-1 mb-1">
                        <span className="text-xl font-black text-indigo-600 leading-none">{site.monthlyViews}</span>
                        <span className="text-[9px] text-slate-400 font-bold uppercase">Views</span>
                    </div>
                    <p className="text-[10px] text-slate-400 font-bold uppercase mb-2">{site.category}</p>
                    <p className="text-xs text-slate-600 line-clamp-2">{site.description}</p>
                </div>
                <div className="flex gap-2 mt-auto">
                    <a href={`https://${site.websiteUrl}`} target="_blank" className="flex-1 text-center py-2 rounded-lg bg-slate-100 text-slate-700 text-[10px] font-bold">Site</a>
                    <a href={`https://www.linkedin.com/search/results/all/?keywords=${site.companyName}`} target="_blank" className="flex-1 text-center py-2 rounded-lg bg-[#0077b5] text-white text-[10px] font-bold">LinkedIn</a>
                </div>
            </div>
        );

        function App() {
            const [selectedCountry, setSelectedCountry] = useState(COUNTRIES[0]);
            const [websites, setWebsites] = useState([]);
            const [loading, setLoading] = useState(false);
            const [page, setPage] = useState(0);

            const fetchBatch = useCallback(async (pageNum) => {
                if (loading || pageNum >= 5) return;
                setLoading(true);
                const start = pageNum * 20 + 1;
                const end = (pageNum + 1) * 20;

                try {
                    const prompt = `Actúa como analista. Dame un JSON con los sitios web del ranking #${start} al #${end} en ${selectedCountry.name}. Formato: [{"websiteUrl": "dominio.com", "companyName": "Nombre", "category": "Categoría", "monthlyViews": "450M", "description": "Breve descripción"}]. Solo JSON puro.`;
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const result = await res.json();
                    const text = result.candidates[0].content.parts[0].text.replace(/```json|```/g, "").trim();
                    const newData = JSON.parse(text);
                    setWebsites(prev => [...prev, ...newData]);
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            }, [selectedCountry, loading]);

            useEffect(() => {
                setWebsites([]);
                setPage(0);
                fetchBatch(0);
            }, [selectedCountry]);

            useEffect(() => {
                const handleScroll = () => {
                    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300 && !loading && page < 4) {
                        setPage(prev => {
                            const next = prev + 1;
                            fetchBatch(next);
                            return next;
                        });
                    }
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, [loading, page, fetchBatch]);

            return (
                <div className="min-h-screen pb-10">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
                        <h1 className="text-xl font-black text-slate-800 tracking-tight">Analytics Explorer</h1>
                        <span className="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-full border border-green-100">LIVE</span>
                    </header>
                    <main className="max-w-7xl mx-auto px-6 mt-8">
                        <div className="flex gap-2 overflow-x-auto pb-6">
                            {COUNTRIES.map(c => (
                                <button key={c.id} onClick={() => setSelectedCountry(c)} className={`px-4 py-2 rounded-full text-xs font-bold transition-all flex-shrink-0 ${selectedCountry.id === c.id ? 'bg-indigo-600 text-white' : 'bg-white text-slate-500 border border-slate-100'}`}>
                                    {c.flag} {c.name}
                                </button>
                            ))}
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            {websites.map((site, i) => <WebsiteCard key={i} site={site} index={i} />)}
                        </div>
                        {loading && <div className="py-10 text-center text-indigo-600 font-bold animate-pulse text-[10px] uppercase tracking-widest">Loading...</div>}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
</body>
</html>
